const P={chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',call:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',video:'<rect x="3" y="6" width="12" height="12" rx="3"/><path d="M15 10l6-3v10l-6-3"/>',story:'<circle cx="12" cy="12" r="8.5" stroke-dasharray="3.2 2.6"/><circle cx="12" cy="12" r="3.5"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/>',back:'<path d="M9 5l7 7-7 7"/>',plus:'<path d="M12 5v14M5 12h14"/>',send:'<path d="M21 3L10 14M21 3l-7 18-4-7-7-4z"/>',heart:'<path d="M12 20s-7-4.5-9-9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c-2 4.5-9 9-9 9z"/>',share:'<path d="M4 12v7h16v-7M12 3v12M8 7l4-4 4 4"/>',moon:'<path d="M20 14A8 8 0 0 1 10 4a8 8 0 1 0 10 10z"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>'};
const ic=(n,f)=>`<svg class="i" viewBox="0 0 24 24" fill="${f?'currentColor':'none'}" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const U=[{id:1,n:'سارة',e:'🌸',c:'#e0457b'},{id:2,n:'أحمد',e:'🎧',c:'#2b7de9'},{id:3,n:'ليلى',e:'📷',c:'#8e44ad'},{id:4,n:'يوسف',e:'⚽',c:'#1e9e6a'},{id:5,n:'مجموعة العيلة',e:'👨‍👩‍👧',c:'#e08a1e'}];
const REP=['تمام 👍','هههههه 😂','أكيد، كلمني بعدين','حلو أوي!','ممكن نتقابل بكرة؟','وصلتني رسالتك ❤️','طيب، لحظة وأرد عليك'];
const ME={n:'أنا',e:'😎',c:'#5b3df5'};
let S={me:null,set:{notif:true,seen:'الجميع'},tab:'feed',chats:{1:[{f:1,t:'صباح الخير! جاهزة للمشوار؟',h:'09:12'}],5:[{f:5,t:'العشا عند ماما الجمعة 🍲',h:'08:40'}]},
posts:[{id:1,u:1,t:'غروب النهاردة كان خرافي 🌅',p:'🌇',bg:'#ffd9a0',l:12,k:false,c:['جميل!']},{id:2,u:3,t:'أول تصوير لي بالكاميرا الجديدة 📷',p:'🏞️',bg:'#bfe3ff',l:30,k:false,c:[]},{id:3,u:4,t:'مين جاي ماتش الليلة؟',p:'',bg:'',l:7,k:false,c:['أنا جاي ⚽']}],theme:''};
try{const r=localStorage.getItem('A_state');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('A_state',JSON.stringify(S))}catch(e){}};
const usr=id=>U.find(x=>x.id===id)||ME;
const av=(u,s)=>`<div class="av ${s||''}" style="background:${u.c}">${u.e}</div>`;
const now=()=>new Date().toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'});
const T=[['feed','🔄','الحالة'],['calls','📞','المكالمات'],['chats','💬','الدردشات'],['me','⚙️','الإعدادات']];
S.tab='chats';
function nav(){$('#nav').innerHTML=T.map(t=>`<button class="${S.tab===t[0]?'on':''}" onclick="go('${t[0]}')"><b>${ic({feed:'story',calls:'call',chats:'chat',me:'gear'}[t[0]])}</b>${t[2]}</button>`).join('')}
function go(t){S.tab=t;render()}
function render(){nav();$('#ttl').textContent=T.find(t=>t[0]===S.tab)[2];const m=$('#main');
if(S.tab==='feed'){m.innerHTML=`<div class="stories"><div class="st" onclick="addStory()"><div class="ring" style="background:var(--ln)"><div class="av" style="background:var(--ot);color:var(--pr);font-size:30px">+</div></div><br>قصتك</div>${U.slice(0,4).map(u=>`<div class="st" onclick="story(${u.id})"><div class="ring">${av(u)}</div><br>${u.n}</div>`).join('')}</div>
<div class="compose"><input id="np" placeholder="بماذا تفكر؟"><button class="btn" onclick="addPost()">انشر</button></div>`+S.posts.map(postH).join('')}
else if(S.tab==='chats'){m.innerHTML=U.map(u=>{const l=(S.chats[u.id]||[]).slice(-1)[0];return `<div class="row" onclick="openChat(${u.id})">${av(u)}<div class="t"><b>${u.n}</b><small>${l?esc(l.t):'ابدأ المحادثة'}</small></div><small>${l?l.h:''}</small></div>`}).join('')+`<button class="fab" onclick="openChat(1)">${ic('plus')}</button>`}
else if(S.tab==='calls'){m.innerHTML=U.slice(0,4).map(u=>`<div class="row">${av(u)}<div class="t"><b>${u.n}</b><small>اتصل الآن</small></div><button class="ic" onclick="call(${u.id},'صوتية')">${ic('call')}</button><button class="ic" onclick="call(${u.id},'فيديو')">${ic('video')}</button></div>`).join('')}
else{m.innerHTML=settingsH();return;const mine=S.posts.filter(p=>p.u===0).length;m.innerHTML=`<div class="me-top">${av(ME)}<h2 style="margin-top:8px">${ME.n}</h2><p style="color:var(--mu)">${mine} منشور · ${U.length} أصدقاء</p></div>
<div class="row" onclick="theme()"><div class="t"><b>المظهر</b><small>بدّل بين الفاتح والداكن</small></div><span class="ic">${ic('moon')}</span></div>
<div class="row" onclick="reset()"><div class="t"><b>مسح البيانات</b><small>يعيد التطبيق لحالته الأولى</small></div><span class="ic">${ic('trash')}</span></div>`}}
function postH(p){const u=usr(p.u);return `<div class="post"><div class="ph">${av(u,'s')}<div><b>${u.n}</b><small>الآن</small></div></div><p>${esc(p.t)}</p>${p.p?`<div class="pic" style="background:${p.bg}">${p.p}</div>`:''}
<div class="act"><button class="${p.k?'on':''}" onclick="like(${p.id})">${ic('heart',p.k)} ${p.l}</button><button onclick="cmt(${p.id})">${ic('chat')} ${p.c.length}</button><button onclick="share()">${ic('share')} مشاركة</button></div>${p.c.map(c=>`<div class="cm">${esc(c)}</div>`).join('')}</div>`}
function addPost(){const v=$('#np').value.trim();if(!v)return;S.posts.unshift({id:Date.now(),u:0,t:v,p:'',bg:'',l:0,k:false,c:[]});save();render()}
function like(id){const p=S.posts.find(x=>x.id===id);p.k=!p.k;p.l+=p.k?1:-1;save();render()}
function cmt(id){const v=prompt('اكتب تعليقك');if(v&&v.trim()){S.posts.find(x=>x.id===id).c.push(v.trim());save();render()}}
function share(){alert('تم نسخ رابط المنشور (نموذج تجريبي)')}
function addStory(){alert('إضافة القصص ستتوفر مع النسخة الكاملة')}
function story(id){const u=usr(id);const o=document.createElement('div');o.className='scr call';o.onclick=()=>o.remove();o.innerHTML=`${av(u)}<h2>${u.n}</h2><p>قصة جديدة ${u.e} — اضغط للإغلاق</p>`;$('#app').append(o)}
function openChat(id){const u=usr(id);S.chats[id]=S.chats[id]||[];const o=document.createElement('div');o.className='scr';
o.innerHTML=`<header><button class="ic" id="bk">${ic('back')}</button>${av(u,'s')}<b style="flex:1;margin:0 10px">${u.n}<small style="display:block;font-weight:400;font-size:12px;opacity:.8">متصل الآن</small></b><button class="ic" id="c1">${ic('call')}</button><button class="ic" id="c2">${ic('video')}</button></header><div class="msgs" id="ms"></div><div class="bar"><input id="mi" placeholder="اكتب رسالة"><button class="btn" id="sd">${ic('send')}</button></div>`;
$('#app').append(o);
const draw=()=>{const b=o.querySelector('#ms');b.innerHTML=S.chats[id].length?S.chats[id].map(m=>`<div class="m ${m.f===0?'me':''}">${esc(m.t)}<small>${m.h}${m.f===0?' <span style="color:#53bdeb">✓✓</span>':''}</small></div>`).join(''):'<div class="empty">قل مرحبا 👋</div>';b.scrollTop=b.scrollHeight};
const send=()=>{const i=o.querySelector('#mi'),v=i.value.trim();if(!v)return;S.chats[id].push({f:0,t:v,h:now()});i.value='';save();draw();
setTimeout(()=>{S.chats[id].push({f:id,t:REP[Math.floor(Math.random()*REP.length)],h:now()});save();if(o.isConnected)draw()},1200)};
o.querySelector('#bk').onclick=()=>{o.remove();render()};o.querySelector('#sd').onclick=send;
o.querySelector('#mi').onkeydown=e=>{if(e.key==='Enter')send()};
o.querySelector('#c1').onclick=()=>call(id,'صوتية');o.querySelector('#c2').onclick=()=>call(id,'فيديو');draw()}
function call(id,k){const u=usr(id);const o=document.createElement('div');o.className='scr call';o.style.zIndex=9;
o.innerHTML=`${av(u)}<h2>${u.n}</h2><p id="st">مكالمة ${k} · جارٍ الاتصال…</p><button class="end">${ic('call')}</button>`;$('#app').append(o);
let s=0,t;const p=o.querySelector('#st');setTimeout(()=>{t=setInterval(()=>{s++;p.textContent=`مكالمة ${k} · ${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`},1000)},1500);
o.querySelector('.end').onclick=()=>{clearInterval(t);o.remove()}}
function theme(){const r=document.documentElement;const d=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark'}
Object.assign(P,{user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',bell:'<path d="M6 17v-6a6 6 0 0 1 12 0v6l2 2H4z"/><path d="M10 21h4"/>',lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',out:'<path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'});
function settingsH(){const me=S.me||{name:'أنا',phone:''},dk=document.documentElement.dataset.theme!=='light';
const r=(i,t,s,oc,x)=>`<div class="row" onclick="${oc}"><span class="ic">${ic(i)}</span><div class="t"><b>${t}</b><small>${s}</small></div>${x||''}</div>`;
return `<div class="me-top"><div class="av">${esc(me.name).slice(0,1)}</div><h2 style="margin-top:8px">${esc(me.name)}</h2><p dir="ltr">${esc(me.phone)}</p></div>
<div class="row"><span class="ic">${ic('user')}</span><div class="t"><b>الاسم</b><input class="nm" value="${esc(me.name)}" maxlength="24" onchange="setName(this.value)"></div></div>`
+r('call','رقم الهاتف',`<span dir="ltr">${esc(me.phone)}</span>`,'')
+r(dk?'moon':'sun','المظهر',dk?'أسود لامع':'أبيض فضي','toggleTheme()')
+r('bell','الإشعارات',S.set.notif?'مفعّلة':'موقوفة','toggleNotif()',`<span class="sw ${S.set.notif?'on':''}"></span>`)
+r('lock','آخر ظهور',S.set.seen,'cycleSeen()')
+r('out','تسجيل الخروج','العودة لشاشة التسجيل','logout()')
+r('trash','مسح البيانات','يعيد التطبيق لحالته الأولى','reset()')}
function setName(v){v=v.trim();if(v){S.me.name=v.slice(0,24);save();render()}}
function toggleNotif(){S.set.notif=!S.set.notif;save();render()}
function cycleSeen(){const a=['الجميع','جهات الاتصال','لا أحد'];S.set.seen=a[(a.indexOf(S.set.seen)+1)%3];save();render()}
function toggleTheme(){S.theme=S.theme==='light'?'dark':'light';document.documentElement.dataset.theme=S.theme;save();render()}
function logout(){S.me=null;save();render();reg()}
const API='';/* اتركه فارغًا إذا كان السيرفر يقدّم الصفحة، أو ضع رابطه */
async function api(p,b){const r=await fetch(API+'/api'+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'حدث خطأ، حاول مرة أخرى');return d}
function reg(){const o=document.createElement('div');o.className='scr reg';o.style.zIndex=20;
o.innerHTML=`<div class="appic"><span>A</span></div><h1>أهلًا بك في A</h1><p id="rp">سجّل برقم هاتفك للبدء</p><div class="fld"><select id="cc"><option>+20</option><option>+966</option><option>+971</option><option>+962</option><option>+212</option><option>+1</option></select><input id="ph" type="tel" inputmode="numeric" placeholder="رقم الهاتف" dir="ltr"></div><div class="err" id="er"></div><button class="btn big" id="go">إرسال الرمز</button><small>سنرسل لك رسالة نصية عادية برمز التحقق</small>`;
$('#app').append(o);let st=1,num='';const q=s=>o.querySelector(s);
q('#go').onclick=async()=>{const e=q('#er');const bt=q('#go');
if(st===1){const v=q('#ph').value.replace(/\D/g,'');if(v.length<8||v.length>12){e.textContent='أدخل رقم هاتف صحيح';return}
num=q('#cc').value+' '+v.replace(/^0+/,'');e.textContent='';bt.disabled=true;try{await api('/send-code',{phone:num.replace(' ','')})}catch(x){e.textContent=x.message;bt.disabled=false;return}bt.disabled=false;q('#rp').textContent='أدخل الرمز المرسل إلى '+num;
const f=q('.fld');f.style.flexDirection='column';f.innerHTML='<input id="cd" inputmode="numeric" maxlength="6" placeholder="رمز التحقق (6 أرقام)" dir="ltr" style="text-align:center;letter-spacing:6px"><input id="nm" maxlength="24" placeholder="اسمك">';q('#go').textContent='تأكيد ودخول';st=2;return}
const c=q('#cd').value.replace(/\D/g,''),n=q('#nm').value.trim();
if(c.length!==6){e.textContent='الرمز من 6 أرقام';return}
if(!n){e.textContent='اكتب اسمك';return}bt.disabled=true;try{await api('/verify-code',{phone:num.replace(' ',''),code:c})}catch(x){e.textContent=x.message;bt.disabled=false;return}
S.me={name:n,phone:num};S.tab='chats';save();o.remove();render()}}
function reset(){try{localStorage.removeItem('A_state')}catch(e){}location.reload()}
document.documentElement.dataset.theme=S.theme||'dark';
render();if(!S.me)reg();
</script>
</body>
</html>
